name: Publish Pi Claude Bridge to npm

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    if: startsWith(github.event.release.tag_name, 'v') && github.repository == 'brunoorsolon/pi-claude-bridge'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.1'
          registry-url: https://registry.npmjs.org/
      - name: Require a merged commit and matching package identity
        run: |
          git fetch --no-tags origin master
          git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          assert.equal(pkg.name, '@puglab/pi-claude-bridge');
          assert.equal(process.env.RELEASE_TAG, `v${pkg.version}`);
          NODE
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm publish --access public --provenance
