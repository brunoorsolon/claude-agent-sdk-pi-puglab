name: Test and publish maintained fork

on:
  pull_request:
  push:
    branches: [master]
    tags: ['fork-v*']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pi: ['0.74.0', '1.4.0', '1.5.0']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install the exact Pi loader under test
        run: npm install --prefix "$RUNNER_TEMP/pi" --ignore-scripts --no-package-lock --no-audit --no-fund "@earendil-works/pi-coding-agent@$PI_VERSION"
        env:
          PI_VERSION: ${{ matrix.pi }}
      - run: npm test
        env:
          PI_TEST_AGENT_ENTRY: file://${{ runner.temp }}/pi/node_modules/@earendil-works/pi-coding-agent/dist/index.js

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/fork-v') && github.repository == 'brunoorsolon/claude-agent-sdk-pi-puglab'
    needs: test
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.1'
          registry-url: https://registry.npmjs.org/
      - name: Require a merged fork commit and matching package identity
        run: |
          git fetch --no-tags origin master
          git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          assert.equal(pkg.name, '@puglab/claude-agent-sdk-pi');
          assert.equal(process.env.RELEASE_TAG, `fork-v${pkg.version}`);
          NODE
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm publish --access public --provenance
